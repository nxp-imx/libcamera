# Neo pipeline platform config file example
#
# This config file format is experimental and subject to change.
#
# It consists in multiple sections whose definitions are optional:
# - global: configure the parameters common to all cameras
# - cameras: configure some attributes for particular cameras
#
# The global section defines the parameters that are common to all cameras. It
# consists in a mapping of properties with their values. The supported global
# properties are:
#
# buffer-count      = number of buffers to allocate for a stream
#
# The cameras section consists in a list of camera definitions, that gives the
# options to specify some attributes for a given camera. A camera is defined
# either by its model or by its unique entity name to designate a specific
# camera, as the model may be shared by multiple instances of the same camera.
#
# Cameras nodes definition:
#
# cameras           = sequence of camera-entry
# camera-entry      = mapping of {name, model, entity, streams}
#
# model             = camera model (optional if entity is defined)
# entity            = camera entity name (optional, if model is defined)
#
# streams           = sequence of streams to be enabled for that camera
#                     stream values belong to [hdr, edata]
#

%YAML 1.1
---
version: 1.0
global:
  buffer-count: 8

...
