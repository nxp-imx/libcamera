%YAML 1.1
---
version: 1
algorithms:
  - PipeConf:
  - Awb:
  - Agc:
  - Ccm:
      ccms: [
          {
              ct: 2613,
              ccm:
              [
                  3.902344, -0.910156, -1.992188,
                  -1.6875, 3.902344, -1.214844,
                  -2.746094, 3.800781, -0.054688
              ],
              offsets: [ 0, 0, 0 ]
          },
          {
              ct: 2880,
              ccm:
              [
                  3.683594, -0.425781, -2.257813,
                  -1.386719, 3.707031, -1.320313,
                  -2.578125, 3.515625, 0.06255
              ],
              offsets: [ 0, 0, 0 ]
          },
          {
              ct: 4142,
              ccm:
              [
                  1.65625, -0.3125, -0.34375,
                  -0.597656, 1.929688, -0.332031,
                  -0.015625, -0.675781, 1.691406
              ],
              offsets: [ 0, 0, 0 ]
          },
          {
              ct: 5488,
              ccm:
              [
                  1.640625, -0.347656, -0.292969,
                  -0.394531, 1.828125, -0.433594,
                  0.066406, -0.597656, 1.53125
              ],
              offsets: [ 0, 0, 0 ]
          },
          {
              ct: 6821,
              ccm:
              [
                  1.617188, -0.261719, -0.355469,
                  -0.402344, 1.906250, -0.503906,
                  0.011719, -0.550781, 1.539063
              ],
              offsets: [ 0, 0, 0 ]
          },
      ]
  - Drc:
      # Global DRC control mode. Select among the following options:
      # 0 - copy. Data is copied from input to output of the DRC block,
      #     no dynamic range compression is done (default)
      # 1 - pre-configured. LUT with 416 entries needs to be specified in this config file
      #     under 'gbl-lut'. If not configured, falls back to mode 0.
      # 2 - dynamic. LUT determined per frame according to input data.
      gbl-mode: 0
  - GammaOutCorrection:
  - RgbIr:
      # CFA pattern for the sensor with hflip enabled is:
      # GRGB / IGIG / GBGR / IGIG
      # R pixel position leads to hoffset=1, voffset=0
      head-color: [ 1, 0 ]
      ccm: [ 4000, 4000, 4000 ]
      crosstalk-threshold: [ 1044480, 1044480, 1044480 ]
      # No compression is applied for this sensor, thus a single knee point is
      # used to apply a unique gain slope.
      ir-compression-8b:
        # No point defined - use default range
        points: [ 0, 0, 0, 0 ]
        offsets: [ 0, 0, 0, 0, 0 ]
        newpoints: [ 0, 0, 0, 0, 0 ]
        # ratio (s1.15) is 2^(8-20) * 2^15
        ratios: [ 0, 0, 0, 0, 8 ]
      ir-compression-16b:
        # No point defined - use default range
        points: [ 0, 0, 0, 0 ]
        offsets: [ 0, 0, 0, 0, 0 ]
        newpoints: [ 0, 0, 0, 0, 0 ]
        # ratio (s1.15) is 2^(16-20) * 2^15
        ratios: [ 0, 0, 0, 0, 2048 ]
...
