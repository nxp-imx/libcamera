%YAML 1.1
---
version: 1
algorithms:
  - Awb:
  - Agc:
  - Drc:
      # Global DRC control mode. Select among the following options:
      # 0 - copy. Data is copied from input to output of the DRC block,
      #     no dynamic range compression is done (default)
      # 1 - pre-configured. LUT with 416 entries needs to be specified in this config file
      #     under 'gbl-lut'. If not configured, falls back to mode 0.
      # 2 - dynamic. LUT determined per frame according to input data.
      gbl-mode: 0
  - GammaOutCorrection:
  - RgbIr:
      # CFA pattern for the sensor with hflip enabled is:
      # GRGB / IGIG / GBGR / IGIG
      # R pixel position leads to hoffset=1, voffset=0
      head-color: [ 1, 0 ]
      ccm: [ 4000, 4000, 4000 ]
      crosstalk-threshold: [ 1044480, 1044480, 1044480 ]
      # No compression is applied for this sensor, thus a single knee point is
      # used to apply a unique gain slope.
      ir-compression-8b:
        # No point defined - use default range
        points: [ 0, 0, 0, 0 ]
        offsets: [ 0, 0, 0, 0, 0 ]
        newpoints: [ 0, 0, 0, 0, 0 ]
        # ratio (s1.15) is 2^(8-20) * 2^15
        ratios: [ 0, 0, 0, 0, 8 ]
      ir-compression-16b:
        # No point defined - use default range
        points: [ 0, 0, 0, 0 ]
        offsets: [ 0, 0, 0, 0, 0 ]
        newpoints: [ 0, 0, 0, 0, 0 ]
        # ratio (s1.15) is 2^(16-20) * 2^15
        ratios: [ 0, 0, 0, 0, 2048 ]
...
