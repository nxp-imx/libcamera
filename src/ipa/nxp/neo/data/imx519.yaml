# CCM matrixes come from RPi imx519.json calibration file
# Autofocus values come from Arducam calibration data
%YAML 1.1
---
version: 1
algorithms:
  - PipeConf:
  - Awb:
  - BlackLevelCorrection:
      # offset 64 for 10-bit bitdepth
      R: 4096
      Gr: 4096
      Gb: 4096
      B: 4096
  - Ccm:
      ccms: [
          {
              ct: 2890,
              ccm:
              [
                  1.36754, -0.18448, -0.18306,
                  -0.32356, 1.44826, -0.12471,
                  -0.00412, -0.69936, 1.70348
              ]
          },
          {
              ct: 2920,
              ccm:
              [
                  1.26704, 0.01624, -0.28328,
                  -0.28516, 1.38934, -0.10419,
                  -0.04854, -0.82211, 1.87066
              ]
          },
          {
              ct: 3550,
              ccm:
              [
                  1.42836, -0.27235, -0.15601,
                  -0.28751, 1.41075, -0.12325,
                  -0.01812, -0.54849, 1.56661
              ]
          },
          {
              ct: 4500,
              ccm:
              [
                  1.36328, -0.19569, -0.16759,
                  -0.25254, 1.52248, -0.26994,
                  -0.01575, -0.53155, 1.54729
              ]
          },
          {
              ct: 5700,
              ccm:
              [
                  1.49207, -0.37245, -0.11963,
                  -0.21493, 1.40005, -0.18512,
                  -0.03781, -0.38779, 1.42561
              ]
          },
          {
              ct: 7900,
              ccm:
              [
                  1.34849, -0.05425, -0.29424,
                  -0.22182, 1.77684, -0.55502,
                  -0.07403, -0.55336, 1.62739
              ]
          }
      ]
  - Agc:
  - Af:
      ranges:
        normal:
          min: 0.0
          max: 12.0
          default: 1.0
        macro:
          min: 3.0
          max: 15.0
          default: 4.0
      speeds:
        # CDAF only - PDAF not supported
        normal:
          step_coarse: 1.0
          step_fine: 0.25
          contrast_ratio: 0.75
          retrigger_ratio: 0.8
          retrigger_delay: 10
          pdaf_gain: 0
          pdaf_squelch: 0.125
          max_slew: 2.0
          pdaf_frames: 20
          dropout_frames: 0
          step_frames: 1
        fast:
          step_coarse: 1.25
          step_fine: 0.0
          contrast_ratio: 0.75
          retrigger_ratio: 0.8
          retrigger_delay: 10
          pdaf_gain: 0
          pdaf_squelch: 0.125
          max_slew: 2.0
          pdaf_frames: 20
          dropout_frames: 0
          step_frames: 1
      conf_epsilon: 8
      conf_thresh: 12
      conf_clip: 512
      skip_frames: 5
      check_for_ir: false
      map: [0.0, 0, 15.0, 4095]
...
